# Codemagic build config for Team Easy. See docs/PIPELINE.md.
# All builds run on mocks (USE_MOCKS=true) so the full UI works without a backend.
# No secrets live in this file. Signing keys and API keys are added in the
# Codemagic UI (Teams > Integrations / Code signing identities).

definitions:
  flutter_checks: &flutter_checks
    name: Get packages, analyze, test
    script: |
      flutter pub get
      flutter analyze
      flutter test
  triggering: &triggering
    events:
      - push
    branch_patterns:
      - pattern: dev
        include: true
        source: true
      - pattern: main
        include: true
        source: true

workflows:
  # Fast design review. Download the zip, or deploy it to Vercel (PIPELINE.md Phase 1).
  web-preview:
    name: Web preview
    instance_type: linux_x2
    max_build_duration: 20
    environment:
      flutter: stable
    triggering: *triggering
    scripts:
      - *flutter_checks
      - name: Build web
        script: flutter build web --release --dart-define=USE_MOCKS=true
      - name: Zip the site
        script: cd build/web && zip -r ../web-preview.zip .
    artifacts:
      - build/web-preview.zip

  # Installable Android build for testers. Download the .apk from the build page
  # and open it on an Android phone (allow "install unknown apps" once).
  # Signed with the debug key for now. Play Store needs a real upload keystore.
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    triggering: *triggering
    scripts:
      - *flutter_checks
      - name: Build APK
        script: flutter build apk --release --dart-define=USE_MOCKS=true
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # Runs in the iOS Simulator on a Mac. No Apple account or signing needed.
  # Unzip, then drag Runner.app onto a running simulator.
  ios-simulator:
    name: iOS Simulator build
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *flutter_checks
      - name: Build for simulator
        script: flutter build ios --simulator --debug --dart-define=USE_MOCKS=true
      - name: Zip the app
        script: cd build/ios/iphonesimulator && zip -r Runner-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/Runner-simulator.zip

  # Real iPhone via TestFlight. Start it by hand until the setup below is done.
  # One-time setup in Codemagic and Apple:
  #   1. Apple Developer Program account ($99/year).
  #   2. Create the app in App Store Connect with bundle ID com.teameasy.teamEasy
  #      and note its numeric Apple ID.
  #   3. Codemagic > Teams > Integrations > App Store Connect: add an API key
  #      and name it exactly as in `app_store_connect` below.
  #   4. Replace APP_STORE_APPLE_ID below with the numeric Apple ID.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TeamEasy
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.teameasy.teamEasy
      vars:
        APP_STORE_APPLE_ID: "0000000000"
    scripts:
      - *flutter_checks
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=USE_MOCKS=true \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
